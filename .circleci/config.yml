version: 2.1

jobs:
  build-and-test:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - run:
          name: "Verify Repository Setup"
          command: |
            echo "CircleCI is working successfully!"
            if [ -f index.html ]; then
              echo "index.html exists!"
            else
              echo "index.html not found!" && exit 1
            fi

workflows:
  main-pipeline:
    jobs:
      - build-and-test